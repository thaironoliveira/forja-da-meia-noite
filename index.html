<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale-1.0">
    <title>Forja da Meia Noite - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-container">
        <h1>Forja da Meia Noite</h1>
        <p class="subtitulo">
            Crie sua conta ou faça login para acessar.
        </p>

        <form id="loginForm">
            <div class="input-group">
                <label for="nome">Nome Completo (só para 1º acesso):</label>
                <input type="text" id="nome" name="nome">
            </div>

            <div class="input-group">
                <label for="email">E-mail (obrigatório):</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="input-group">
                <label for="whatsapp">WhatsApp (opcional):</label>
                <input type="tel" id="whatsapp" name="whatsapp" placeholder="(xx) xxxxx-xxxx">
            </div>

            <button type="submit" class="btn-login" id="btnLogin">
                Acessar o Gerador
            </button>

            <p id="formMensagem"></p>
        </form>
    </div>

    <footer class="site-footer">
        © 2025 Forja da Meia Noite. Todos os direitos reservados.
    </footer>

    <script src="login.js"></script>
</body>
</html>
